[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bdg2-anomaly"
version = "0.1.0"
description = "Real-time building energy anomaly detection with Kafka and Spark on Building Data Genome 2"
readme = "README.md"
requires-python = ">=3.11,<3.12"
# No base dependencies: each task installs only the extras it needs.
dependencies = []

[project.optional-dependencies]
# Task 1, 2, 3 (anything that runs Spark).
spark = [
    "pyspark==4.2.0",
    "delta-spark==4.4.0",  # requires pyspark in [4.0.1, 4.2.0]
    "numpy==2.4.6",        # pyspark.ml needs it; 2.5+ requires Python 3.12
]
# Task 3 extras on top of `spark`: Kafka client and Delta reads without the JVM (producer).
streaming = [
    "confluent-kafka==2.16.0",
    "deltalake==1.6.6",
    "pyarrow==26.0.0",
    "tzdata==2026.5",  # pyarrow needs it for UTC timestamps on Windows
]
# Task 4 reads Delta with delta-rs, no Spark needed.
dashboard = [
    "deltalake==1.6.6",
    "pyarrow==26.0.0",
]
# Exploration notebooks (notebooks/): Spark aggregates -> pandas -> charts.
notebook = [
    "pandas==2.3.3",  # PySpark 4.2 does not fully support pandas 3 yet
    "matplotlib==3.11.2",
    "ipykernel==7.4.0",  # run notebooks in VS Code / Jupyter
    "nbclient==0.11.0",  # execute notebooks headless
]
dev = [
    "ruff==0.17.1",
    "pytest==9.1.1",
    "pre-commit==4.7.0",
]

[tool.setuptools.packages.find]
# Task folders become packages as they get tests, e.g. `from data_pipeline.preprocess import ...`.
include = ["common*", "data_pipeline*", "ml_model*", "streaming*"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
# pycodestyle, pyflakes, isort, pyupgrade, bugbear, pep8-naming
select = ["E", "W", "F", "I", "UP", "B", "N"]
# N812: `from pyspark.sql import functions as F` is the standard PySpark idiom.
ignore = ["N812"]

[tool.ruff.lint.isort]
known-first-party = ["common", "data_pipeline", "ml_model", "streaming"]

[tool.pytest.ini_options]
testpaths = ["data_pipeline", "ml_model", "streaming", "dashboard"]
addopts = "--import-mode=importlib"
